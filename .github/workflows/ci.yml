name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Pinned versions and checksums live in .github/ci-tools.txt and
      # .github/requirements/ (both kept current by Renovate).
      - name: Install linters
        run: |
          bash .github/install-ci-tools.sh "$RUNNER_TEMP/ci-bin" shellcheck actionlint taplo
          python3 -m venv "$RUNNER_TEMP/yamllint"
          "$RUNNER_TEMP/yamllint/bin/pip" install --quiet --require-hashes --no-deps -r .github/requirements/yamllint.txt
          ln -s "$RUNNER_TEMP/yamllint/bin/yamllint" "$RUNNER_TEMP/ci-bin/"
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
      # shellcheck, actionlint, taplo and yamllint; LINT_STRICT turns a missing
      # linter into a failure instead of a SKIP.
      - name: Lint (repository lint entry point)
        env:
          LINT_STRICT: '1'
        run: HOME="$(mktemp -d)" bash tests/run.sh lint

  stylua:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install StyLua
        run: |
          bash .github/install-ci-tools.sh "$RUNNER_TEMP/ci-bin" stylua
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
      - run: HOME="$(mktemp -d)" stylua --check .config/nvim .config/hypr

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # lua5.4 provides luac for tests/test_material_folder_icons.py.
      - run: sudo apt-get update && sudo apt-get install -y jq tmux python3 zsh lua5.4 rsync
      # The Lua tests need newer Neovim APIs than stock Ubuntu ships;
      # tests/starship_config_test.sh renders the tracked prompt with Starship.
      - name: Install Neovim and Starship
        run: |
          bash .github/install-ci-tools.sh "$RUNNER_TEMP/ci-bin" nvim starship
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
      # Complete test entry point (Lua, shell and Python cases). No plugin
      # downloads, network-dependent tests or display are used.
      - name: Tests
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/test-logs
        run: |
          nvim --version | head -n 1
          starship --version | head -n 1
          luac -v
          python3 --version
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME/.config" XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share" XDG_STATE_HOME="$HOME/.local/state"
          export CODEX_HOME="$HOME/.codex"
          bash tests/run.sh test
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-ubuntu
          path: ${{ runner.temp }}/test-logs
          if-no-files-found: ignore

  # Arch Linux is the primary workstation: run the suite against Arch's own
  # (rolling) tmux, Neovim, Starship and ShellCheck. Tests run as a normal user.
  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: archlinux:latest@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
      # An init process reaps killed children; without it ai_run_limited_test
      # sees the zombie of the process it killed as still alive.
      options: --init
    steps:
      - name: Install Arch packages
        run: |
          pacman -Syu --noconfirm --needed git neovim tmux jq python python-yaml zsh lua rsync starship shellcheck perl
          useradd --create-home ci
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint and tests
        run: |
          nvim --version | head -n 1
          tmux -V
          starship --version | head -n 1
          shellcheck --version | sed -n 2p
          python --version
          chown -R ci: "$GITHUB_WORKSPACE"
          # shellcheck disable=SC2016 # expanded by the inner shell, as user ci
          runuser -u ci -- bash -c '
            set -eo pipefail
            HOME=$(mktemp -d)
            export HOME TMUX=
            export XDG_CONFIG_HOME="$HOME/.config" XDG_CACHE_HOME="$HOME/.cache"
            export XDG_DATA_HOME="$HOME/.local/share" XDG_STATE_HOME="$HOME/.local/state"
            export CODEX_HOME="$HOME/.codex" TEST_LOG_DIR=/tmp/test-logs
            bash tests/run.sh lint
            bash tests/run.sh test
          '
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-arch
          path: /tmp/test-logs
          if-no-files-found: ignore

  # Boots the full Neovim config with the plugins pinned in lazy-lock.json
  # (tests/smoke/nvim_plugins.sh) and records the startup time. Non-blocking
  # while it proves itself: it clones ~80 plugins from GitHub on every run.
  nvim-plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    env:
      SMOKE_BUDGET_MS: '250'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Neovim
        run: |
          bash .github/install-ci-tools.sh "$RUNNER_TEMP/ci-bin" nvim
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
      - name: Boot the full config with locked plugins
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke
        run: |
          bash tests/smoke/nvim_plugins.sh check
          cat "$SMOKE_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Startup budget
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke
        run: |
          jq . "$SMOKE_OUT/startup.json"
          jq -e .within_budget "$SMOKE_OUT/startup.json" >/dev/null || {
            echo "::warning::median startup $(jq .median_ms "$SMOKE_OUT/startup.json") ms is over the ${SMOKE_BUDGET_MS} ms budget"
            exit 1
          }
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nvim-plugins-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  # Stock macOS: /bin/bash 3.2, BSD tools and no GNU timeout. PATH is curated so
  # Homebrew's GNU tools cannot mask the compatibility paths this job exists to test.
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        working-directory: ${{ runner.temp }}
        run: |
          # tmux_config_test exercises which-key realpath from tmux with stock PATH.
          brew install jq tmux lua python@3.12 coreutils
          /bin/bash "$GITHUB_WORKSPACE/.github/install-ci-tools.sh" ci-bin nvim shellcheck starship
          ln -s "$(brew --prefix jq)/bin/jq" "$(brew --prefix tmux)/bin/tmux" "$(brew --prefix lua)/bin/luac" ci-bin/
          ln -s "$(brew --prefix python@3.12)/bin/python3.12" ci-bin/python3
      - name: Stock-shell lint and tests
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/test-logs
        run: |
          export PATH="$RUNNER_TEMP/ci-bin:/usr/bin:/bin:/usr/sbin:/sbin"
          /bin/bash --version | head -n 1
          nvim --version | head -n 1
          starship --version | head -n 1
          shellcheck --version | sed -n 2p
          tmux -V
          jq --version
          luac -v
          python3 --version
          ruby -ryaml -e 'puts "Ruby YAML available"'
          command -v bash stat wc sed readlink perl rsync
          if command -v timeout gtimeout; then echo "GNU timeout must not be on PATH" >&2; exit 1; fi
          HOME=$(mktemp -d)
          export HOME
          export XDG_CONFIG_HOME="$HOME/.config" XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share" XDG_STATE_HOME="$HOME/.local/state"
          export CODEX_HOME="$HOME/.codex" TMUX=''
          /bin/bash tests/run.sh lint
          /bin/bash tests/run.sh test
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-macos
          path: ${{ runner.temp }}/test-logs
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          bash .github/install-ci-tools.sh "$RUNNER_TEMP/ci-bin" gitleaks
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
      - run: HOME="$(mktemp -d)" gitleaks git --log-opts=--all --redact
