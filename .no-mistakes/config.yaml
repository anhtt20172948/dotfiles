# no-mistakes - global config (~/.no-mistakes/config.yaml, via install.sh).
# Repo level: .no-mistakes.yaml at the repo root overrides this file.
# Reference: https://github.com/kunchenguid/no-mistakes (docs/reference/global-config.md)

# Tried in order; if an agent cannot run, the next one is used.
# Runs on the HOST (~/.local/bin/claude ...). Docker comes in a later phase via
# agent_path_override pointing at a docker exec wrapper.
agent: [claude, codex, opencode]

# The daemon runs under systemd and does not read .zshenv: Claude goes through ai-acct so every
# agent run loads the token of the selected account (ai-acct use NAME), no daemon
# restart needed when switching accounts.
agent_path_override:
  claude: ai-acct-claude

agent_timeout: "30m"
review_agent_timeout: "30m"
test_agent_timeout: "30m"

# Max auto-fix rounds per step. review = 0: review findings stop and ask a human.
auto_fix:
  rebase: 3
  review: 0
  test: 3
  document: 3
  lint: 3
  ci: 3

log_level: info
