# no-mistakes - config toàn cục (~/.no-mistakes/config.yaml, qua install.sh).
# Repo-level: .no-mistakes.yaml ở root repo, ưu tiên hơn file này.
# Tham chiếu: https://github.com/kunchenguid/no-mistakes (docs/reference/global-config.md)

# Thử theo thứ tự; agent không chạy được thì sang cái kế tiếp.
# Chạy trên HOST (~/.local/bin/claude ...). Docker để phase sau qua
# agent_path_override trỏ vào wrapper docker exec.
agent: [claude, codex, opencode]

# Daemon chạy bằng systemd, không đọc .zshenv: Claude đi qua ai-acct để mỗi lần
# chạy agent đều nạp token của tài khoản đang chọn (ai-acct use NAME), không cần
# restart daemon khi đổi tài khoản.
agent_path_override:
  claude: ai-acct-claude

agent_timeout: "30m"
review_agent_timeout: "30m"
test_agent_timeout: "30m"

# Số vòng tự sửa tối đa mỗi bước. review = 0: phát hiện review thì dừng hỏi người.
auto_fix:
  rebase: 3
  review: 0
  test: 3
  document: 3
  lint: 3
  ci: 3

log_level: info
