# ============================================================
# TMUX CONFIG — Modular dotfiles
# Source ordering matters (options → keymaps → plugins →
#   status → popup → hooks → navigation → TPM)
#
# popup.conf is sourced after keymaps.conf, so a key bound in both goes to
# popup.conf. Check `tmux list-keys -T prefix` before adding one.
# The theme (status.conf) uses ANSI colour names only, so it follows the
# terminal palette and does not depend on any plugin.
# ============================================================

source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/keymaps.conf
source-file ~/.config/tmux/plugins.conf
source-file ~/.config/tmux/status.conf
source-file ~/.config/tmux/popup.conf
source-file ~/.config/tmux/hooks.conf
source-file ~/.config/tmux/navigation.conf

# TPM auto-bootstrap. The clone chains straight into install_plugins AND tpm
# itself: previously tpm was launched separately on the next line, which on a
# first-ever run raced the clone and came up with no plugins at all.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run -b 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins && ~/.tmux/plugins/tpm/tpm'" \
   "run -b '~/.tmux/plugins/tpm/tpm'"
