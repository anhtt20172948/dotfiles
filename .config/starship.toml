"$schema" = "https://starship.rs/config-schema.json"

# Shell prompt for bash and zsh on every host. The workflow repo installs
# Starship and runs `starship init`; this file is only the look.
#
# - ANSI colour names only, never hex, so the prompt follows the terminal palette
#   (kitty, and through it DMS) locally and over SSH. Nothing sets a background
#   except the directory pill, so kitty's transparency shows through.
# - The accent is cyan (ANSI 6, DMS primary), as in tmux, fzf, yazi and lualine.
# - The pill caps are lualine's slanted glyphs: U+E0BA on the left, U+E0BC on
#   the right. Glyphs are written as \u escapes so they survive any editor.
# - Never `purple` (ANSI 5) or `bright-black` (ANSI 8) as text: DMS makes those
#   slots dark container tones (see .config/tmux/status.conf).
# - Every module reads state Starship already has (env vars, the exit status,
#   the clock) except git, which runs the git CLI, and custom.root, which runs
#   one `sh` to read the uid; command_timeout bounds both. Nothing else shells
#   out per prompt, which is why there is no `sudo` module.
# - The info line: root in red when the shell is root, host over SSH,
#   directory, git (branch, state, status, uncommitted line counts),
#   virtualenv or conda env, background jobs, then, right-aligned by $fill, the
#   last command's duration and the clock. The input line: the failed command's
#   exit status, then the prompt character.
# - The right side is $fill, not right_format: `starship init bash` draws a
#   right prompt only under ble.sh, so right_format would drop the duration in
#   bash. On a pane too narrow for both sides $fill shrinks to nothing and the
#   line wraps, as any long info line does.
# - starship-plain.toml is the same prompt in plain ASCII, for terminals without
#   a Nerd Font: STARSHIP_CONFIG=~/.config/starship-plain.toml.

format = """
${custom.root}\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$python\
$conda\
$jobs\
$fill\
$cmd_duration\
$time\
$line_break\
$status\
$character"""
add_newline = true
continuation_prompt = "[\u2219 ](cyan)"
command_timeout = 500

# Root in red - locally, over SSH and after `su` or `sudo -s` - and never any
# other user. Starship's username module always shows the user over SSH, and its
# only off switch (a negated detect_env_vars) hides root too, so this is a custom
# module gated on the effective uid. `sh`, not $STARSHIP_SHELL, so zsh does not
# read .zshenv; $EUID saves the `id` fork where sh is bash.
[custom.root]
when = '[ "${EUID:-$(id -u)}" = 0 ]'
shell = ["sh"]
format = "[root]($style) "
style = "bold red"

# Only over SSH, with the same icon and colour as the tmux status bar.
[hostname]
ssh_only = true
ssh_symbol = "\U000f08c0 "
format = "[$ssh_symbol$hostname]($style) "
style = "bright-purple"

# The accent pill: black text on cyan between slanted caps.
[directory]
style = "cyan"
read_only = " \U000f033e"
read_only_style = "black bg:cyan"
truncation_length = 3
format = "[\ue0ba]($style)[ $path[$read_only]($read_only_style) ](bold black bg:cyan)[\ue0bc]($style) "

[git_branch]
symbol = "\ue0a0 "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bright-purple"

[git_state]
style = "bold yellow"

# Ahead green, behind red, the rest yellow: the tmux git segment's colours.
# The git CLI rather than Starship's built-in gitoxide: in a 100k-file repo it
# is 2-3x faster, and only an external command is cut off at command_timeout.
# git_metrics follows this setting too.
[git_status]
use_git_executable = true
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
ahead = "[\u21e1${count}](green)"
behind = "[\u21e3${count}](red)"
diverged = "[\u21e1${ahead_count}](green)[\u21e3${behind_count}](red)"

# Lines added and deleted in tracked files since the last commit.
[git_metrics]
disabled = false
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "green"
deleted_style = "red"

# Only the active virtualenv: no project detection, no `python --version` call.
[python]
detect_extensions = []
detect_files = []
detect_folders = []
symbol = "\ue606 "
format = "[$symbol$virtualenv]($style) "
style = "blue"

# The active conda env from $CONDA_DEFAULT_ENV; base stays quiet.
[conda]
ignore_base = true
symbol = "\ue715 "
format = "[$symbol$environment]($style) "
style = "green"

[jobs]
symbol = "\u2726"
number_threshold = 1
format = "[$symbol$number]($style) "
style = "blue"

# The failed command's exit code, beside the red prompt character.
[status]
disabled = false
symbol = "\uf467 "
format = "[$symbol$status]($style) "
style = "bold red"

# Blank space between the left modules and the right-aligned duration and clock.
[fill]
symbol = " "
style = "none"

[cmd_duration]
min_time = 2000
format = "[\U000f051f $duration]($style)"
style = "yellow"

[time]
disabled = false
time_format = "%H:%M"
format = "[ \uf43a $time]($style)"
style = "white"

[character]
success_symbol = "[\u276f](bold cyan)"
error_symbol = "[\u276f](bold red)"
vimcmd_symbol = "[\u276e](bold green)"
vimcmd_visual_symbol = "[\u276e](bold yellow)"
vimcmd_replace_symbol = "[\u276e](bold bright-purple)"
vimcmd_replace_one_symbol = "[\u276e](bold bright-purple)"
