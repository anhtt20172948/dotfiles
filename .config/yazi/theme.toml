# No [flavor]: yazi falls back to its built-in theme, which uses terminal colours,
# so the file manager follows the terminal palette (kitty, and through it DMS).

# The hovered row is the accent: ANSI cyan (DMS primary), the same marker as the
# tmux current window and the fzf pointer. Upstream reverses the row's colours.
[indicator]
parent  = { fg = "black", bg = "cyan" }
current = { fg = "black", bg = "cyan", bold = true }

# Named directory icons (synced with neo-tree/mini.icons): distinct Material Design
# folder-* variants in the Nerd Fonts PUA, verified to render in kitty.
# Colours are ANSI names (the terminal's 16-colour palette), never hex. They
# follow the old catppuccin mapping: mauve->lightmagenta, blue->blue,
# teal->cyan, sapphire->lightcyan, peach->yellow, yellow->lightyellow,
# green->green, red->red, overlay_1->darkgray.
[icon]
