[opener]
edit = [{ run = 'nvim "$@"', block = true }]
play = [{ run = 'vlc "$@"', block = false }]

[preview]
max_width = 3000
max_height = 3000
wrap = "yes"

[mgr]
ratio = [2, 4, 4]
show_hidden = true
linemode = "size_and_mtime"


# center-media: centered image/video/audio previews with mediainfo metadata
# (falls back to Yazi's own previewers when mediainfo is not installed).
# Previewers and preloaders need the same rules.
[[plugin.prepend_previewers]]
mime = "{audio,video,image}/*"
run = "center-media"

[[plugin.prepend_preloaders]]
mime = "{audio,video,image}/*"
run = "center-media"

# duckdb: tabular data previews; duckdb-guard falls back to plain text without the duckdb CLI.
# JSON is left out on purpose: nested config files read far better in Yazi's
# syntax-highlighted code previewer. Press `g o` to open a JSON file in duckdb.
[[plugin.prepend_previewers]]
url = "*.{csv,tsv,parquet,xlsx,db,duckdb}"
run = "duckdb-guard"

[[plugin.prepend_preloaders]]
url = "*.{csv,tsv,parquet,xlsx}"
run = "duckdb-guard"
