# ============================================================
# HOOKS
# ============================================================

# Note: there is no after-split-window hook here on purpose. It used to run a
# bare 'select-pane', which targets the *current* pane and so did nothing —
# tmux already focuses the new pane after a split. Keeping the cwd on split is
# handled by -c "#{pane_current_path}" in keymaps.conf.

# Refresh status on pane focus
set-hook -g pane-focus-in "refresh-client -S"
