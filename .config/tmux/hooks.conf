# ============================================================
# HOOKS — Dark/Light + events
# ============================================================

# Dark/Light theme toggle (requires tmux 3.5+)
# Wrapped in 'if-shell' so older tmux versions won't crash loading this file
if-shell -b '[ "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" \>= "3.5" ]' {
  set-hook -g client-dark-theme {
    set -g @catppuccin_flavor "mocha"
    run-shell '~/.tmux/plugins/tmux/catppuccin.tmux'
  }
  set-hook -g client-light-theme {
    set -g @catppuccin_flavor "latte"
    run-shell '~/.tmux/plugins/tmux/catppuccin.tmux'
  }
}

# Keep current directory on new split/window
# Simplified: 'select-pane' without flags defaults to target the newly created pane
set-hook -g after-split-window "select-pane"

# Refresh status on pane focus
set-hook -g pane-focus-in "refresh-client -S"
