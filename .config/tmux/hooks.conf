# ============================================================
# HOOKS — Dark/Light + events
# ============================================================

# Dark/Light theme toggle (chỉ được kích hoạt ở tmux 3.6+)
set-hook -g client-dark-theme {
  set -g @catppuccin_flavor "mocha"
  run '~/.tmux/plugins/tmux/catppuccin.tmux'
}
set-hook -g client-light-theme {
  set -g @catppuccin_flavor "latte"
  run '~/.tmux/plugins/tmux/catppuccin.tmux'
}

# Keep current directory on new split/window
set-hook -g after-split-window "select-pane -t #{pane_id}"

# Refresh status on pane focus
set-hook -g pane-focus-in "refresh-client -S"
