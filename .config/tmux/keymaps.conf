# ============================================================
# KEYMAPS — Navigation, Resize, Copy Mode, Utils
# ============================================================

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable)
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3
# No -r: zoom is a toggle, repeat would immediately undo it
bind m resize-pane -Z

# Pane splitting (keep current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Swap panes
bind < swap-pane -U
bind > swap-pane -D

# Copy mode (vi)
# 'y' is intentionally not bound here: tmux-yank loads after this file (via TPM)
# and binds it to copy-pipe-and-cancel wl-copy, which is what we want.
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle

# Utils
bind S setw synchronize-panes \; display-message "Sync: #{?synchronize-panes,ON,OFF}"
bind C-l send-keys C-l \; clear-history \; display-message "Buffer cleared!"
bind W confirm-before -p "Kill window #W? (y/n)" kill-window
bind R command-prompt -I "#S" "rename-session '%%'"

# Override rename-window — popup, Esc cancels, icon
bind , run-shell '
  wname=$(tmux display-message -p "#W")
  tmux display-popup -w 50% -h 15% -T " 󰆍  Rename Window " \
    -E "bash ~/.config/tmux/scripts/rename-window.sh \"$wname\""
'
