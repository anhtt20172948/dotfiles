# ============================================================
# KEYMAPS — Navigation, Resize, Copy Mode, Utils
# ============================================================

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Unbind plugin cũ (tmux-fzf, đã bỏ)
unbind F

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable)
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3
bind -r m resize-pane -Z

# Pane splitting (giữ thư mục hiện tại)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Swap panes
bind < swap-pane -U
bind > swap-pane -D

# Copy mode (vi)
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel

# Utils
bind S setw synchronize-panes \; display-message "Sync: #{?synchronize-panes,ON,OFF}"
bind C-l send-keys C-l \; clear-history \; display-message "Buffer cleared!"
bind W kill-window
bind R command-prompt -I "#S" "rename-session '%%'"

# Override rename-window — popup, Esc hủy, icon
bind , run-shell '
  wname=$(tmux display-message -p "#W")
  tmux display-popup -w 50% -h 15% -T " 󰆍  Rename Window " \
    -E "bash ~/.config/tmux/scripts/rename-window.sh \"$wname\""
'
