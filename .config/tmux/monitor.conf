# Monitor Center Configuration
# Path: ~/.config/tmux/monitor.conf

# Launch mode: replace|split|window
#   replace - replaces current pane (exec)
#   split   - opens in new tmux split pane
#   window  - opens in new tmux window
MONITOR_LAUNCH_MODE="window"

# Split direction: h (horizontal) | v (vertical)
MONITOR_SPLIT_DIRECTION="h"

# Split size (percentage or leave empty for automatic)
MONITOR_SPLIT_SIZE=""

# Danger thresholds (0-100)
MONITOR_DANGER_CPU=85
MONITOR_DANGER_MEM=85
MONITOR_DANGER_DISK=85

# Warning thresholds (0-100)
MONITOR_WARN_CPU=65
MONITOR_WARN_MEM=65
MONITOR_WARN_DISK=65

# Window auto-cleanup: when tool exits, automatically close the tmux window
MONITOR_WINDOW_AUTO_CLEANUP=true

# Popup window dimensions (for --popup mode, tmux ≥ 3.2)
MONITOR_POPUP_WIDTH="80%"
MONITOR_POPUP_HEIGHT="85%"

# Preview window width (percentage or absolute, e.g. "65%" or "80")
MONITOR_PREVIEW_WIDTH="65%"

# Max processes to show in preview
MONITOR_PREVIEW_PROCESSES=6

# History tracking (sparklines)
MONITOR_HISTORY_ENABLED=true
MONITOR_HISTORY_SIZE=20

# Status bar format (for --status flag): space-separated fields
# Available: cpu mem disk temp load uptime
MONITOR_STATUS_FORMAT="cpu mem disk temp"

# Auto-refresh preview interval (milliseconds, 0 to disable)
# Preview updates continuously when browsing
MONITOR_PREVIEW_REFRESH_MS=2000

# Custom tools: key;command;description;group;icon
# Use | to separate multiple tools
# Group: gpu|system|container|network|custom
# Icon: any Nerd Font icon character
#MONITOR_CUSTOM_TOOLS="mytail;tail -f /var/log/syslog;System Log;custom;󰂺|mygpu;watch -n 1 nvidia-smi;GPU Watch;gpu;󰢮"

