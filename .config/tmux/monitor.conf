# Monitor Center Configuration
# Path: ~/.config/tmux/monitor.conf

# NOTE on launch mode: MONITOR_LAUNCH_MODE / MONITOR_SPLIT_DIRECTION /
# MONITOR_SPLIT_SIZE / MONITOR_WINDOW_AUTO_CLEANUP are intentionally NOT set
# here. The normal 'prefix M' entrypoint runs monitor.sh --popup, which then
# uses --popup-inner and forces window + auto-cleanup. Set them in the
# environment only when invoking monitor.sh directly without --popup.

# Danger thresholds (0-100)
MONITOR_DANGER_CPU=85
MONITOR_DANGER_MEM=85
MONITOR_DANGER_DISK=85

# Warning thresholds (0-100)
MONITOR_WARN_CPU=65
MONITOR_WARN_MEM=65
MONITOR_WARN_DISK=65

# Popup window dimensions. `prefix M` and `monitor.sh --popup` both use these
# values (tmux ≥ 3.2).
MONITOR_POPUP_WIDTH="80%"
MONITOR_POPUP_HEIGHT="85%"

# Preview window width (percentage or absolute, e.g. "65%" or "80")
MONITOR_PREVIEW_WIDTH="65%"

# Max processes to show in preview
MONITOR_PREVIEW_PROCESSES=6

# History tracking (CPU sparkline in the preview pane).
# State lives in ${TMPDIR:-/tmp}/monitor-$UID and is kept between runs on
# purpose — it is the CPU-delta cache, not a temp dir.
MONITOR_HISTORY_ENABLED=true
MONITOR_HISTORY_SIZE=20

# Status bar format (for `monitor.sh --status`): space-separated fields.
# Available: cpu mem disk temp load uptime
# Not wired into the tmux status bar by default — status.conf does not call
# monitor.sh. Add it there yourself if you want it (mind status-interval).
MONITOR_STATUS_FORMAT="cpu mem disk temp"

# Auto-refresh preview interval (milliseconds, 0 to disable)
# Preview updates continuously when browsing
MONITOR_PREVIEW_REFRESH_MS=2000

# Custom tools: key;command;description;group;icon
# Use | to separate multiple tools
# Group: gpu|system|container|network|custom
# Icon: any Nerd Font icon character
#MONITOR_CUSTOM_TOOLS="mytail;tail -f /var/log/syslog;System Log;custom;󰂺|mygpu;watch -n 1 nvidia-smi;GPU Watch;gpu;󰢮"

# Theme colors (color name: black red green yellow blue magenta cyan white dim bold)
#MONITOR_COLOR_HEADER="magenta"
#MONITOR_COLOR_LABEL="cyan"
#MONITOR_COLOR_BAR_LABEL="blue"
#MONITOR_COLOR_GOOD="green"
#MONITOR_COLOR_WARN="yellow"
#MONITOR_COLOR_DANGER="red"
#MONITOR_COLOR_DIM="dim"
