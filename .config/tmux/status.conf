# ============================================================
# THEME - ANSI colour names only, never hex
# ============================================================
# tmux maps these to the terminal's 16-colour palette, so it follows kitty (and
# through it DMS) live, and looks the same over SSH on any terminal. bg=default
# lets kitty's transparency show through. Rough Catppuccin mapping:
#   base->default  text->white  overlay_0/surface_0->brightblack  green->green
#   red->red  maroon->brightred  blue->blue  yellow/peach->yellow
#   pink->magenta  mauve->brightmagenta
set -g status-style "bg=default,fg=default"
set -g message-style "bg=default,fg=yellow"
set -g message-command-style "bg=default,fg=cyan"
set -g mode-style "bg=blue,fg=black"
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=cyan"

# ============================================================
# STATUS-LEFT
# ============================================================
set -g status-left-length 100
set -g status-left ""
# Inside #{?...} a bare comma ends the branch, so every style list below spells
# its commas as '#,'. (The #{#[...]} wrapper that used to be used here parses but
# applies no style on tmux 3.8, which left the prefix indicator uncoloured.)
set -ga status-left "#{?client_prefix,#[bg=red#,fg=black#,bold],#[bg=default#,fg=green]}  #S #[bg=default,fg=default,none]"
# Dangerous-mode flags sit right next to the session so they are the first thing
# seen. Both are loud (black on yellow/red) and print nothing when off.
#   COPY: the pane is in a mode (copy-mode, view-mode...), keys no longer reach it.
#   SYNC: synchronize-panes is on, every keystroke goes to every pane of the window.
set -ga status-left "#{?pane_in_mode,#[bg=yellow#,fg=black#,bold] 󰆏 COPY #[bg=default#,fg=default#,none],}"
set -ga status-left "#{?pane_synchronized,#[bg=red#,fg=black#,bold] 󰓦 SYNC #[bg=default#,fg=default#,none],}"
set -ga status-left "#[bg=default,fg=brightblack,none]│"
set -ga status-left "#[bg=default,fg=blue]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=default,fg=brightblack,none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=default,fg=yellow]#{?window_zoomed_flag,  zoom ,}"

# ============================================================
# STATUS-RIGHT
# ============================================================
# Date, clock, battery and online state are deliberately absent: the desktop bar
# (DMS) already shows them, and over SSH the local clock is the one that matters.
# What is left is what only tmux knows: the SSH host and git state of the focused
# pane, and the live AI agents.
set -g status-right-length 100
set -g status-right ""
# SSH host + git branch/dirty. The script prints nothing outside a repo and when
# not on ssh, and tmux runs it in the background once per status-interval.
# #{q:...} shell-quotes the path, so spaces and quotes in it are safe.
set -ga status-right "#[bg=default]#(~/.config/tmux/scripts/status-context.sh #{q:pane_current_path} #{q:pane_tty} #{q:pane_current_command})"
# Live AI agents on the dedicated ai-popup server. The script prints nothing at
# all when idle, rather than being wrapped in a #{?#(cmd),#(cmd),} guard - that
# shape forks the script twice per redraw.
set -ga status-right "#[bg=default]#(~/.config/tmux/scripts/ai-status.sh)"

# ============================================================
# STATUS BAR OPTIONS
# ============================================================
# Top, not bottom: nvim's lualine already owns the bottom row, so two bars no
# longer stack there.
set -g status-position top
set -g status-justify "absolute-centre"
# ============================================================
# PANE BORDERS
# ============================================================
setw -g pane-border-status bottom
# A compact label makes the extra border row useful: it identifies each pane
# without spending vertical room on a full path or title.
setw -g pane-border-format " #P · #{pane_current_command} "
setw -g pane-active-border-style "bg=default,fg=cyan"
setw -g pane-border-style "bg=default,fg=brightblack"
# The active pane gets arrows on its border as well as the cyan colour, so it
# stays obvious in a monochrome capture or for colour-blind eyes. Both options
# are newer than the oldest servers this config meets (pane-border-lines 3.2,
# pane-border-indicators 3.3), so each is gated on the running version.
if-shell 'v=$(tmux -V | tr -dc "0-9."); [ "$(printf "%s\n3.3\n" "$v" | sort -V | head -n1)" = 3.3 ]' \
  'set -g pane-border-indicators both'

# ============================================================
# WINDOW STATUS
# ============================================================
# automatic-rename / automatic-rename-format live in options.conf (they were set
# identically in both files). The "Window" sentinel set there is what the
# #{!=:...,Window} test below keys off to render auto-named windows as bare indices.

# Program icon per window tab, chosen from the window's active-pane command.
# A chain of #{?regex-match,icon,<previous>} kept as one user option per rule
# (lowest priority first) so each rule stays readable; the last one,
# @tab_icon, is what the window formats expand. It starts empty, so an unknown
# program just shows no icon. The leading space is part of each icon. Nerd Font
# glyphs, like the other status segments.
# Needs the E: format modifier (tmux >= 3.2); older servers keep plain tabs.
set -g @tab_icon_0 ""
set -g @tab_icon_1 '#{?#{m/r:^(zsh|bash|fish|sh|dash|nu)$,#{pane_current_command}}, ,#{E:@tab_icon_0}}'
set -g @tab_icon_2 '#{?#{m/r:^(claude|codex|opencode|gemini)$,#{pane_current_command}}, 󰚩,#{E:@tab_icon_1}}'
set -g @tab_icon_3 '#{?#{m/r:^(node|npm|pnpm|bun|deno)$,#{pane_current_command}}, ,#{E:@tab_icon_2}}'
set -g @tab_icon_4 '#{?#{m/r:^(python[0-9.]*|uv|ipython)$,#{pane_current_command}}, ,#{E:@tab_icon_3}}'
set -g @tab_icon_5 '#{?#{m/r:^(cargo|rustc)$,#{pane_current_command}}, ,#{E:@tab_icon_4}}'
set -g @tab_icon_6 '#{?#{m/r:^(go)$,#{pane_current_command}}, ,#{E:@tab_icon_5}}'
set -g @tab_icon_7 '#{?#{m/r:^(yazi|ranger|lf|nnn)$,#{pane_current_command}}, ,#{E:@tab_icon_6}}'
set -g @tab_icon_8 '#{?#{m/r:^(docker|lazydocker)$,#{pane_current_command}}, ,#{E:@tab_icon_7}}'
set -g @tab_icon_9 '#{?#{m/r:^(btop|htop|top|nvtop)$,#{pane_current_command}}, ,#{E:@tab_icon_8}}'
set -g @tab_icon_10 '#{?#{m/r:^(git|lazygit|tig)$,#{pane_current_command}}, ,#{E:@tab_icon_9}}'
set -g @tab_icon_11 '#{?#{m/r:^(ssh|mosh|mosh-client)$,#{pane_current_command}}, 󰣀,#{E:@tab_icon_10}}'
set -g @tab_icon_12 '#{?#{m/r:^(vim|nvim|vi|view)$,#{pane_current_command}}, ,#{E:@tab_icon_11}}'
set -g @tab_icon "#{E:@tab_icon_12}"

# Plain tabs first, so every server loads; the icon variants replace them where
# E: exists. window_name is the "Window" sentinel from options.conf for
# auto-named windows (they render as a bare index), a real name otherwise.
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
if-shell 'v=$(tmux -V | tr -dc "0-9."); [ "$(printf "%s\n3.2\n" "$v" | sort -V | head -n1)" = 3.2 ]' \
  'set -g window-status-format " #I#{E:@tab_icon}#{?#{!=:#{window_name},Window},: #W,} " ; set -g window-status-current-format " #I#{E:@tab_icon}#{?#{!=:#{window_name},Window},: #W,} "'

set -g window-status-style "bg=default,fg=white"
set -g window-status-last-style "bg=default,fg=yellow"
set -g window-status-activity-style "bg=red,fg=black"
set -g window-status-bell-style "bg=red,fg=black,bold"
set -g window-status-separator "#[bg=default,fg=brightblack]│"

set -g window-status-current-style "bg=yellow,fg=black,bold"
