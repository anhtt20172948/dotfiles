# ============================================================
# THEME - ANSI colour names only, never hex
# ============================================================
# tmux maps these to the terminal's 16-colour palette, so it follows kitty (and
# through it DMS) live, and looks the same over SSH on any terminal. bg=default
# lets kitty's transparency show through. Rough Catppuccin mapping:
#   base->default  text->white  overlay_0/surface_0->brightblack  green->green
#   red->red  maroon->brightred  blue->blue  yellow/peach->yellow
#   pink->magenta  mauve->brightmagenta
set -g status-style "bg=default,fg=default"
set -g message-style "bg=default,fg=yellow"
set -g message-command-style "bg=default,fg=cyan"
set -g mode-style "bg=blue,fg=black"
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "fg=cyan"

# ============================================================
# PLUGIN OPTIONS
# ============================================================
set -g @online_icon "ok"
set -g @offline_icon "nok"

# ============================================================
# STATUS-LEFT
# ============================================================
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=red,fg=black,bold]  #S },#{#[bg=default,fg=green]  #S }}"
set -ga status-left "#[bg=default,fg=brightblack,none]│"
set -ga status-left "#[bg=default,fg=brightred]  #{pane_current_command} "
set -ga status-left "#[bg=default,fg=brightblack,none]│"
set -ga status-left "#[bg=default,fg=blue]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=default,fg=brightblack,none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=default,fg=yellow]#{?window_zoomed_flag,  zoom ,}"

# ============================================================
# STATUS-RIGHT
# ============================================================
set -g status-right-length 100
set -g status-right ""
# Outer #{?battery_percentage,...} guard: on a machine with no battery the value
# is empty, and the bare #{e|>=:10,} comparison then reads as 10>=0 = true,
# pinning the segment red forever with a blank percentage. Guard hides it instead.
# Every #[...] inside a conditional must be wrapped as #{#[...]} — a bare comma
# in #[bg=x,fg=y] is read as the conditional's argument separator and silently
# collapses the whole format to empty.
set -ga status-right "#{?battery_percentage,#{?#{e|>=:10,#{battery_percentage}},#{#[bg=red,fg=black]},#{#[bg=default,fg=magenta]}} #{battery_icon} #{battery_percentage} ,}"
set -ga status-right "#{?battery_percentage,#{#[bg=default,fg=brightblack,none]}│,}"
set -ga status-right "#[bg=default]#{?#{==:#{online_status},ok},#{#[fg=brightmagenta]} 󰖩 on ,#{#[fg=red,bold]}#{#[reverse]} 󰖪 off }"
set -ga status-right "#[bg=default,fg=brightblack,none]│"
# Live AI agents on the dedicated ai-popup server. The script prints its own
# separator, or nothing at all when idle, rather than being wrapped in a
# #{?#(cmd),#(cmd),} guard — that shape forks the script twice per redraw.
set -ga status-right "#[bg=default]#(~/.config/tmux/scripts/ai-status.sh)"
# Session start time. The old #{session_created_string} was removed from tmux
# years ago and rendered as a bare icon with nothing after it. In #{t/f/...} the
# ':' of the strftime spec must be escaped as '#:' or the format parses as empty.
set -ga status-right "#[bg=default,fg=blue] 󰭦 %Y-%m-%d 󰅐 %H:%M 󰋗 #{t/f/%H#:%M:session_created} "


# ============================================================
# STATUS BAR OPTIONS
# ============================================================
set -g status-position bottom
set -g status-justify "absolute-centre"
# ============================================================
# PANE BORDERS
# ============================================================
setw -g pane-border-status bottom
# A compact label makes the extra border row useful: it identifies each pane
# without spending vertical room on a full path or title.
setw -g pane-border-format " #P · #{pane_current_command} "
setw -g pane-active-border-style "bg=default,fg=cyan"
setw -g pane-border-style "bg=default,fg=brightblack"
# setw -g pane-border-lines single

# ============================================================
# WINDOW STATUS
# ============================================================
# automatic-rename / automatic-rename-format live in options.conf (they were set
# identically in both files). The "Window" sentinel set there is what the
# #{!=:...,Window} test below keys off to render auto-named windows as bare indices.

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=default,fg=white"
set -g window-status-last-style "bg=default,fg=yellow"
set -g window-status-activity-style "bg=red,fg=black"
set -g window-status-bell-style "bg=red,fg=black,bold"
set -g window-status-separator "#[bg=default,fg=brightblack]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=yellow,fg=black,bold"
