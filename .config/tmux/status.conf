# ============================================================
# CATPPUCCIN OVERRIDES
# ============================================================
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"

# ============================================================
# PLUGIN OPTIONS
# ============================================================
set -g @online_icon "ok"
set -g @offline_icon "nok"

# ============================================================
# STATUS-LEFT
# ============================================================
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# ============================================================
# STATUS-RIGHT
# ============================================================
set -g status-right-length 100
set -g status-right ""
# Outer #{?battery_percentage,...} guard: on a machine with no battery the value
# is empty, and the bare #{e|>=:10,} comparison then reads as 10>=0 = true,
# pinning the segment red forever with a blank percentage. Guard hides it instead.
# Every #[...] inside a conditional must be wrapped as #{#[...]} — a bare comma
# in #[bg=x,fg=y] is read as the conditional's argument separator and silently
# collapses the whole format to empty.
set -ga status-right "#{?battery_percentage,#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} ,}"
set -ga status-right "#{?battery_percentage,#{#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]}│,}"
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#{#[fg=#{@thm_mauve}]} 󰖩 on ,#{#[fg=#{@thm_red},bold]}#{#[reverse]} 󰖪 off }"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
# Session start time. The old #{session_created_string} was removed from tmux
# years ago and rendered as a bare icon with nothing after it. In #{t/f/...} the
# ':' of the strftime spec must be escaped as '#:' or the format parses as empty.
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M 󰋗 #{t/f/%H#:%M:session_created} "


# ============================================================
# STATUS BAR OPTIONS
# ============================================================
set -g status-position bottom
set -g status-justify "absolute-centre"
# status-style is deliberately NOT set here. @catppuccin_status_background "none"
# (top of this file) makes catppuccin run 'set -g status-style default' when TPM
# loads, which is after every source-file — so any value set here is dead.
# Per-segment #[bg=#{@thm_bg}] below is what actually paints the bar.

# ============================================================
# PANE BORDERS
# ============================================================
setw -g pane-border-status bottom
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
# setw -g pane-border-lines single

# ============================================================
# WINDOW STATUS
# ============================================================
# automatic-rename / automatic-rename-format live in options.conf (they were set
# identically in both files). The "Window" sentinel set there is what the
# #{!=:...,Window} test below keys off to render auto-named windows as bare indices.

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
# -g not -gF: -F expands at parse time, but @thm_* only exist once catppuccin
# loads via TPM (after this file), so on a cold server start this resolved to a
# literal "#[bg=,fg=]│". Lazy expansion, like every other line here.
set -g window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"
