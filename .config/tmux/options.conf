# ============================================================
# OPTIONS — Terminal, History, Base Settings
# ============================================================

set -g base-index 1
setw -g pane-base-index 1

set -g default-terminal "tmux-256color"
# 'set -gu' first: these are array options, and 'prefix r' re-sources this file
# without resetting, so bare -ga appended a duplicate on every single reload.
# -gu restores tmux's built-in default (keeping e.g. linux*:AX@), then -ga adds
# ours — idempotent no matter how many times the config is reloaded.
set -gu terminal-overrides
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"

# Kitty capabilities tmux cannot detect on its own: truecolor, coloured
# undercurl, OSC 8 hyperlinks, synchronized updates, extended keys. Needs tmux
# >= 3.2; terminal-features is -a appended, so reload would duplicate: reset first.
set -gu terminal-features
set -as terminal-features ',xterm-kitty:RGB:usstyle:hyperlinks:sync:extkeys'

# Lets nvim in tmux see Ctrl-Enter, Ctrl-Shift-<key> etc. (tmux >= 3.2). The
# csi-u format needs tmux >= 3.5; older servers keep their default xterm format.
set -g extended-keys on
if-shell 'v=$(tmux -V | tr -dc "0-9."); [ "$(printf "%s\n3.5\n" "$v" | sort -V | head -n1)" = 3.5 ]' \
  'set -g extended-keys-format csi-u'

set -g history-limit 50000

set-option -sg escape-time 0
set-option -g focus-events on
set -g mouse on
set-option -g set-clipboard on
set -g allow-passthrough on
# Same reset-then-append reason as terminal-overrides above.
set -gu update-environment
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

setw -g mode-keys vi

# status-interval 5, not 2: status-right runs status-context.sh and ai-status.sh,
# and continuum's save check, every interval per attached client.
set -g status-interval 5

# automatic-rename is set here only; status.conf relies on this pair to make
# auto-named windows render as bare indices via window-status-format.
setw -g automatic-rename on
set -g automatic-rename-format "Window"
