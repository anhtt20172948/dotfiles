# ============================================================
# NAVIGATION — vim-tmux-navigator (Neovim integration)
# ============================================================

set -g @vim_navigator_mapping_left "C-Left C-h"
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-Up C-k"
set -g @vim_navigator_mapping_down "C-Down C-j"
set -g @vim_navigator_mapping_prev ""
set -g @vim_navigator_prefix_mapping_clear_screen ""

# Which foreground process makes tmux pass C-h/j/k/l through instead of switching
# panes. The plugin's default list already contains fzf; atuin is added because
# its search UI binds C-j/C-k to move the selection, and without this tmux
# swallowed both — the pane changed instead, so only the arrow keys worked inside
# Ctrl-R.
#
# Everything except `|atuin` is the plugin's own default, copied verbatim: the
# option replaces the default rather than extending it, so dropping any part of
# it would silently break pass-through for vim itself.
#
# Verified against a live process: `ps -o state= -o comm= -t <pane_tty>` reports
# `S atuin` while the search UI is open, which is what this regex is matched
# against.
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf|atuin)(diff)?(-wrapped)?'
