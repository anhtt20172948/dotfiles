# Minimal tmux server used only by persistent AI coding popups.
set -g prefix C-b
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
# 25ms, not 10, and it matters more than usual because Escape is bound below:
# tmux must wait this long to tell a bare Escape from the start of an Alt/CSI
# sequence. Too low and an arrow key or Alt chord gets split, which here means a
# spurious detach rather than a mere stray character. 25ms of latency on an
# intentional Escape is imperceptible, so the tradeoff is one-sided.
set -sg escape-time 25
set -g mouse on
set -g status off
set -g destroy-unattached off

# Close the popup — leaving the agent running — with Escape, or with C-b d. The
# inner server's own prefix reaches this nested client because display-popup
# routes all input to the popup's process.
#
# Escape is a ROOT-table binding (-n), so tmux consumes it and the agent never
# receives it. That is a deliberate, known tradeoff: you give up Escape as an
# interrupt and Esc-Esc as Claude's rewind, and you get one-key close.
#
# What makes it acceptable is that Ctrl-c is NOT bound here and passes straight
# through, and both Codex and Claude Code treat Ctrl-c as an interrupt — so a
# running agent is still stoppable from inside the popup, just with a different
# key. Do not "fix" this binding back without also re-reading that sentence.
#
# M-Escape would be no help as a compromise: most terminals send Alt as an ESC
# prefix, so it arrives as Esc-Esc — exactly the rewind chord.
bind-key -n Escape detach-client
