# Minimal tmux server used only by persistent AI coding popups.
set -g prefix C-b
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
set -sg escape-time 10
set -g mouse on
set -g status off
set -g destroy-unattached off

# Escape detaches the popup client. Ctrl-c is deliberately not bound here, so
# it passes through to Codex, OpenCode or Claude Code normally.
bind-key -n Escape detach-client
