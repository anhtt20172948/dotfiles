# ============================================================
# POPUP — Shared popup keybinds
# ============================================================

# Lazygit
bind g display-popup -d '#{pane_current_path}' \
  -w 90% -h 85% -E "lazygit"

# Lazydocker
bind G display-popup -d '#{pane_current_path}' \
  -w 90% -h 85% -E "lazydocker"

# Btop (fallback htop)
bind b display-popup -d '#{pane_current_path}' \
  -w 60% -h 60% -E "btop 2>/dev/null || htop"

# Monitor Center
bind M display-popup -d '#{pane_current_path}' \
  -w 90% -h 85% -E \
  "~/.config/tmux/scripts/monitor.sh --popup-inner"

# File finder (fd + fzf)
bind f display-popup -d '#{pane_current_path}' \
  -w 75% -h 75% -E \
  "~/.config/tmux/scripts/file-finder.sh"

# Ripgrep search
bind / display-popup -d '#{pane_current_path}' \
  -w 75% -h 75% -E \
  "~/.config/tmux/scripts/grep-finder.sh"

# Sesh session picker (run-shell chạy qua shell → $HOME OK)
bind K run-shell "$HOME/.config/tmux/scripts/sesh-picker.sh"

# Scratchpad (toggle floating session)
bind T if-shell -F '#{==:#{session_name},scratch}' \
  'detach-client' \
  'display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch"'
