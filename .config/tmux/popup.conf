# ============================================================
# POPUP — Shared popup keybinds
# ============================================================

# Persistent AI popup.
#
# 'a' opens the tool picker, then that tool's session list — the browse path,
# and the only way to reach 'New session'.
# 'A' is the fast path: attach the most recently used live agent for this
# project in one keystroke, falling back to 'a' when nothing is running.
bind a display-popup -d '#{pane_current_path}' \
  -w 90% -h 90% -b rounded \
  -T ' 󰘩 AI · #{b:pane_current_path} ' \
  -E "~/.config/tmux/scripts/persistent-ai.sh"

bind A display-popup -d '#{pane_current_path}' \
  -w 90% -h 90% -b rounded \
  -T ' 󰘩 AI · latest · #{b:pane_current_path} ' \
  -E "~/.config/tmux/scripts/persistent-ai.sh --latest"

# Lazygit
bind g display-popup -d '#{pane_current_path}' \
  -w 90% -h 85% -E "lazygit"

# Lazydocker
bind G display-popup -d '#{pane_current_path}' \
  -w 90% -h 85% -E "lazydocker"

# Btop (fallback htop)
bind b display-popup -d '#{pane_current_path}' \
  -w 60% -h 60% -E "btop 2>/dev/null || htop"

# Monitor Center
# --popup reads the dimensions from monitor.conf. Pass the pane ID rather than
# its path so monitor.sh can safely resolve the working directory itself.
bind M run-shell -b 'exec "$HOME/.config/tmux/scripts/monitor.sh" --popup "#{pane_id}"'

# File finder (fd + fzf)
bind f display-popup -d '#{pane_current_path}' \
  -w 75% -h 75% -E \
  "~/.config/tmux/scripts/file-finder.sh"

# Ripgrep search
bind / display-popup -d '#{pane_current_path}' \
  -w 75% -h 75% -E \
  "~/.config/tmux/scripts/grep-finder.sh"

# Sesh session picker — replaces the default 'choose-tree -Zs' on prefix s.
# NOT bound to K: keymaps.conf uses K for resize-pane -U, and popup.conf is
# sourced later, so binding K here would silently kill vertical resize.
bind s display-popup -d '#{pane_current_path}' \
  -w 80% -h 70% -E \
  "~/.config/tmux/scripts/sesh-picker.sh"

# Scratchpad (toggle floating session)
bind T if-shell -F '#{==:#{session_name},scratch}' \
  'detach-client' \
  'display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch"'
