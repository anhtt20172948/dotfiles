# ============================================================
# PLUGINS — TPM + 6 plugins
# ============================================================

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

# Auto-save is continuum's job, not resurrect's — @resurrect-auto-save is not a
# real option and was a silent no-op. Interval is in minutes.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @plugin 'tmux-plugins/tmux-yank'

# The theme is self-owned (ANSI colours in status.conf), not a plugin.

# tmux-cpu removed: it was loaded but status.conf never referenced #{cpu_*}.
# System stats live in the Monitor Center popup (prefix M) instead.
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'

set -g @plugin 'christoomey/vim-tmux-navigator'
