# ============================================================
# PLUGINS — TPM + 6 plugins
# ============================================================

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

# Auto-save is continuum's job, not resurrect's — @resurrect-auto-save is not a
# real option and was a silent no-op. Interval is in minutes.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @plugin 'tmux-plugins/tmux-yank'

# The theme is self-owned (ANSI colours in status.conf), not a plugin.

# tmux-cpu removed: it was loaded but status.conf never referenced #{cpu_*}.
# System stats live in the Monitor Center popup (prefix M) instead.
# tmux-battery and tmux-online-status removed with the status-right clock: the
# desktop bar already shows battery, connectivity and time, and nothing else
# referenced #{battery_*} or #{online_status}.

# Hint-based copy: `prefix Tab` greps the pane for URLs, paths, git hashes, IPs,
# quoted strings..., and Enter copies the one you pick (fzf, so typing narrows
# it). Chosen over tmux-fingers because it is only python3 + fzf, both already
# needed here: fingers 2.x ships a prebuilt binary with no linux aarch64 build
# (the Jetson), so it would need a Crystal toolchain there. The extra filters
# (git hash, IPv4) live in ~/.config/extrakto/extrakto.conf, tracked in this repo.
# Neither extrakto nor tmux-which-key publishes tags, so TPM tracks the default
# branch like the plugins above; TPM cannot pin to a commit.
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'tab'
set -g @extrakto_filter_order 'all word line path url quote s-quote hash ip'
set -g @extrakto_popup_size '80%,60%'
set -g @extrakto_fzf_layout 'reverse'
# Only the visible/recent area of every pane in the window: the default 'full'
# greps the whole 50000-line scrollback, which is slow and mostly stale.
set -g @extrakto_grab_area 'window recent'

# Key hint menu: `prefix Space` opens a grouped menu of the popup and workflow
# bindings. The menu is plugins/tmux-which-key/config.yaml in this directory. XDG
# mode makes the plugin read it from ~/.config/tmux/plugins/tmux-which-key
# (tracked in this repo) and write its generated init.tmux under XDG_DATA_HOME,
# so the TPM checkout stays pristine. It needs python3 (pyyaml is vendored).
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @tmux-which-key-xdg-enable 1

set -g @plugin 'christoomey/vim-tmux-navigator'
