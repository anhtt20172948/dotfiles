# Theme uses ANSI color names only, so lazygit inherits the palette that DMS
# writes into kitty (~/.config/kitty/dank-theme.conf) instead of its green
# defaults. Mapping from dank16 slots: cyan = color6 (DMS primary, also
# url_color), blue = color4 (DMS secondary), red = color1, yellow = color3.
# `default` keeps the terminal background and foreground.
gui:
  # File and branch icons; kitty draws Nerd Fonts v3 glyphs.
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - cyan
      - bold
    inactiveBorderColor:
      - default
    searchingActiveBorderColor:
      - blue
      - bold
    optionsTextColor:
      - blue
    # reverse, not a background colour: lazygit takes only the 8 base colour
    # names (or hex) here, and none of them is a surface every palette keeps
    # readable text on (default text on blue is 1.6:1 with DMS, and lazygit's
    # red file-status letter on it 1.1:1). reverse swaps each cell's own
    # colours, so every glyph of the row keeps its contrast.
    selectedLineBgColor:
      - reverse
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - blue
    cherryPickedCommitBgColor:
      - cyan
    markedBaseCommitFgColor:
      - blue
    markedBaseCommitBgColor:
      - yellow
    unstagedChangesColor:
      - red
    defaultFgColor:
      - default
# Diffs go through delta, styled by the [delta] section of ~/.config/git/config
# (ANSI colours only). This is the lazygit 0.66 schema: lazygit 0.48 ignores the
# key and shows git's plain colour diff. The 0.48 key (git.paging) is
# deliberately absent: lazygit 0.66 migrates old keys by rewriting this file,
# which is a symlink into the dotfiles checkout.
git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never
