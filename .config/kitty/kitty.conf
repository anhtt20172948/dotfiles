# Configuration
font_family                 family='SFMono Nerd Font' postscript_name=SFMonoNerdFontComplete-SemiBold
bold_font                   family='SFMono Nerd Font' style=Bold
italic_font                 auto
bold_italic_font            auto
font_size                   9

remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            10000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.8
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none

# custom keybindings
kitty_mod ctrl+shift

map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab

# turns off the default kitty keybinding for closing tabs
map kitty_mod+q no_op
map ctrl+shift+w no_op

copy_on_select yes

# Left Option sends Alt (macOS only): the Neovim picker <A-...> keys and the fzf
# alt-j/alt-k bindings need it. Right Option still types accented characters.
macos_option_as_alt left

# Animated cursor follows text
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
# Cursor trail uses the active palette cursor colour (the default).

# Include wallpaper colors
# include colors-wallust.conf
# include colors-matugen.conf
# include ./kitty-themes/themes/mocha.conf

# Include Custom Configuration
# Create the file custom.conf in ~/.config/kitty to overwrite the default configuration
# include ./custom.conf

# Fallback colours (Catppuccin Mocha), used until DMS generates its files.
include current-theme.conf
include custom-tabs-colors.conf

# DMS writes dank-theme.conf and dank-tabs.conf from the wallpaper (see matugen
# kitty.toml). They are included after the fallbacks so their colours win;
# globinclude is a no-op when a file is missing, so kitty still starts.
globinclude dank-theme.conf
globinclude dank-tabs.conf

# Tab bar layout (powerline slanted, bottom, centered). Included last so DMS sets
# the tab colours but never the layout.
include custom-tabs.conf
