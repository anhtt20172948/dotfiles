# Configuration
font_family                 family='SFMono Nerd Font' postscript_name=SFMonoNerdFontComplete-SemiBold
bold_font                   family='SFMono Nerd Font' style=Bold
italic_font                 family='SFMono Nerd Font' style=Bold
bold_italic_font            family='SFMono Nerd Font' style=Bold
font_size                   9

# Render Nerd Font glyphs bằng font standalone để icon to & đồng nhất hơn.
# Chữ vẫn dùng SFMono Nerd Font; chỉ các range icon dưới đây đổi font.
# Range U+F0001-U+F1AF0 là Material Design Icons (mini.icons trong neo-tree).
# Cần cài: sudo pacman -S ttf-nerd-fonts-symbols-mono
symbol_map U+E0A0-U+E0D4 Symbols Nerd Font Mono
symbol_map U+E200-U+E2A9 Symbols Nerd Font Mono
symbol_map U+E300-U+E3E3 Symbols Nerd Font Mono
symbol_map U+E5FA-U+E6B7 Symbols Nerd Font Mono
symbol_map U+E700-U+E8EF Symbols Nerd Font Mono
symbol_map U+EA60-U+EBEB Symbols Nerd Font Mono
symbol_map U+F000-U+F2FF Symbols Nerd Font Mono
symbol_map U+F300-U+F381 Symbols Nerd Font Mono
symbol_map U+F400-U+F533 Symbols Nerd Font Mono
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font Mono

remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.8
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none

# custom keybindings
kitty_mod ctrl+shift

map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab

# turns off the default kitty keybinding for closing tabs
map kitty_mod+q no_op
map ctrl+shift+w no_op

copy_on_select yes

# Animated cursor follows text
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color #ffb4a6

sync_to_monitor no # fixes lag cursor trail on 0.43.0


# Include wallpaper colors
# include colors-wallust.conf
# include colors-matugen.conf
# include ./kitty-themes/themes/mocha.conf

# Include Custom Configuration
# Create the file custom.conf in ~/.config/kitty to overwrite the default configuration
# include ./custom.conf

include current-theme.conf

# Custom tab bar (powerline slanted, Catppuccin Mocha + VSCode-yellow active tab)
include custom-tabs.conf
