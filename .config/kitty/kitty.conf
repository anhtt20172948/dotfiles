# Configuration
font_family                 family='SFMono Nerd Font' postscript_name=SFMonoNerdFontComplete-SemiBold
bold_font                   family='SFMono Nerd Font' style=Bold
italic_font                 auto
bold_italic_font            auto
font_size                   9

remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            10000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.93
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none

# custom keybindings
kitty_mod ctrl+shift

map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab

# turns off the default kitty keybinding for closing tabs
map kitty_mod+q no_op
map ctrl+shift+w no_op

copy_on_select yes

# Animated cursor follows text
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color #ffb4a6

# Include wallpaper colors
# include colors-wallust.conf
# include colors-matugen.conf
# include ./kitty-themes/themes/mocha.conf

# Include Custom Configuration
# Create the file custom.conf in ~/.config/kitty to overwrite the default configuration
# include ./custom.conf

# Fallback theme (Catppuccin Mocha), used until DMS generates dank-theme.conf.
include current-theme.conf

# DMS writes dank-theme.conf from the wallpaper (see matugen kitty.toml). It is
# included after the fallback so its colors win; globinclude is a no-op when the
# file is missing, so kitty still starts. dank-tabs.conf is intentionally not
# included: it carries tab layout (edge, style, title templates) that
# custom-tabs.conf owns.
globinclude dank-theme.conf

# Custom tab bar (powerline slanted, Catppuccin Mocha + VSCode-yellow active tab)
include custom-tabs.conf
