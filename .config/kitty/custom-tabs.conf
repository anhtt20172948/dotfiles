# ──────────────────────────────────────────────────────────────
# Tab bar
# ──────────────────────────────────────────────────────────────
tab_bar_edge            bottom
tab_bar_style           powerline
tab_bar_align           center
tab_powerline_style     angled
tab_bar_min_tabs        1
tab_bar_margin_width    0.0
tab_bar_margin_height   2.5 1.5
tab_bar_margin_color    #1E1E2E

tab_bar_background              #181825
active_tab_foreground           #1E1E2E
active_tab_background           #DCB67A
active_tab_font_style           bold
inactive_tab_foreground         #A6ADC8
inactive_tab_background         #11111B
inactive_tab_font_style         normal


tab_title_max_length           40
# Activity / Bell
tab_activity_symbol            " ● "
bell_on_tab                    " 🔔 "
# Inactive tab
tab_title_template             "{fmt.fg.green}{bell_symbol}{activity_symbol}{fmt.fg.tab}{sup.index}  {title}"
# Active tab
active_tab_title_template      "{fmt.bold}{fmt.fg.tab}{sup.index}  {title}{fmt.nobold}"
