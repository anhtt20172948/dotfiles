# Extra extrakto filters (the built-in ones are word, path, url, quote, s-quote,
# line). tmux order and the popup are set in ~/.config/tmux/plugins.conf; the
# names here must be listed in @extrakto_filter_order to be cycled with Ctrl-F.

[hash]
# Git commit ids: 7-40 hex chars on a word boundary, with at least one letter so
# plain numbers and years are not picked up.
regex: \b((?=[0-9a-f]*[a-f])[0-9a-f]{7,40})\b
min_length: 7

[ip]
# IPv4 addresses, with an optional :port.
regex: \b((?:\d{1,3}\.){3}\d{1,3}(?::\d{1,5})?)\b
min_length: 7
