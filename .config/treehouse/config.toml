# treehouse - shared worktree pool for every repo (install_agent_workflow).
# A repo that needs something else puts treehouse.toml at its root (`treehouse init`).

# Max worktrees in the pool per repo. Each firstmate crewmate holds one slot.
max_trees = 8

# Empty = $HOME/.treehouse. Kept outside dotfiles so worktrees never land in the
# repo.
# root = "$HOME/.treehouse"

# Slot name <repo>-<slot> instead of <repo>: aiterm_history and tmux ai-sessions group
# sessions by directory, so equal leaf names would mix sessions across worktrees.
unique_leaf = true
