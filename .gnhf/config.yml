# gnhf - global config (~/.gnhf/config.yml, via install.sh).
# Iteration/token limits are runtime flags (--max-iterations, --max-tokens), not
# stored here; the tmux menu (prefix F) and <leader>ag pass default flags.

agent: claude

# feat:/fix: commits, matching the dotfiles commit convention.
commitMessage:
  preset: conventional

# Stop after this many consecutive failed iterations instead of burning tokens all night.
maxConsecutiveFailures: 3

# Overnight runs: keep the machine awake (systemd-inhibit).
preventSleep: true
